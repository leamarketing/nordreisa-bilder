name: Kontroller bildefiler

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Hent filer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Kontroller bilder og koblinger
        run: python3 scripts/check_assets.py
